[project]
name = "nebula-ai-stack"
version = "0.1.0"
description = "Nebula AI Stack - 端到端可复现的模块化 AI 系统（CPU 优先，整合业界开源 SOTA）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "晨星" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "numpy>=2.0.0",
    "qdrant-client>=1.9.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
nebula = "nebula.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
